<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with LLM</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #chat-container {
            width: 90%;
            max-width: 600px;
            height: 80%;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #chat-header {
            background-color: #007bff;
            color: white;
            padding: 10px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }

        #chat-window {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .message {
            margin: 5px 0;
            padding: 10px;
            border-radius: 10px;
            max-width: 70%;
        }

        .user-message {
            background-color: #007bff;
            color: white;
            align-self: flex-end;
        }

        .llm-message {
            background-color: #f1f1f1;
            color: black;
            align-self: flex-start;
        }

        #chat-input-container {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ddd;
        }

        #chat-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        #send-button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            margin-left: 10px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        #send-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div id="chat-container">
        <div id="chat-header">Chat with {{ model_name }}</div>
        <div id="chat-window"></div>
        <div id="chat-input-container">
            <input type="text" id="chat-input" placeholder="Type your message..." />
            <button id="send-button">Send</button>
        </div>
    </div>

    <script>
        const chatWindow = document.getElementById("chat-window");
        const chatInput = document.getElementById("chat-input");
        const sendButton = document.getElementById("send-button");

        // Function to add a message to the chat window
        function addMessage(content, isUser = true) {
            const messageDiv = document.createElement("div");
            messageDiv.classList.add("message");
            messageDiv.classList.add(isUser ? "user-message" : "llm-message");
            messageDiv.textContent = content;
            chatWindow.appendChild(messageDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight; // Scroll to the bottom
        }

        // Handle sending a message
        sendButton.addEventListener("click", async () => {
            const userMessage = chatInput.value.trim();
            if (!userMessage) return;

            // Add user message to the chat window
            addMessage(userMessage, true);
            chatInput.value = "";

            // Send the message to the server
            const formData = new FormData();
            formData.append("message", userMessage);

            try {
                const response = await fetch("/chat/completions", {
                    method: "POST",
                    body: formData,
                });

                if (!response.ok) {
                    // Handle HTTP errors
                    const errorData = await response.json();
                    addMessage(`Error: ${errorData.error || "Unknown error occurred."}`, false);
                    return;
                }

                const data = await response.json();

                // Add LLM response to the chat window
                if (data.choices && data.choices.length > 0) {
                    addMessage(data.choices[0].text.trim(), false);
                } else {
                    addMessage("Error: No response from the LLM.", false);
                }
            } catch (error) {
                addMessage("Error: Unable to connect to the server.", false);
            }
        });

        // Allow pressing Enter to send a message
        chatInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                sendButton.click();
            }
        });
    </script>
</body>
</html>
